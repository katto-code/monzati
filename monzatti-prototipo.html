<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Monzatti · Prototipo interactivo</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ececec;--fg:#111;--card:#fff;--line:#ddd;--mut:#666;--gold:#c9a227;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161616;--fg:#f2f2f2;--card:#222;--line:#383838;--mut:#a0a0a0}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{height:100%}*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex}
#main{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:16px;min-width:0}
aside{width:290px;background:var(--card);border-left:1px solid var(--line);padding:16px;overflow:auto;font-size:13px}
aside h3{margin:0 0 4px;font-size:15px}aside h4{margin:14px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.pv,.ab{display:block;width:100%;text-align:left;padding:8px 10px;margin:2px 0;border:1px solid transparent;border-radius:8px;background:none;color:var(--fg);font:inherit;font-size:12px;cursor:pointer}
.pv:hover,.ab:hover{background:var(--bg)}.pv.on{background:#111;color:#fff}.row{display:flex;gap:6px}.row .ab{text-align:center;border-color:var(--line)}
@media(max-width:800px){body{flex-direction:column;height:auto;min-height:100%}aside{width:100%;border-left:0;border-top:1px solid var(--line)}}
.ph{width:360px;height:720px;flex:none;background:#f5f5f5;color:#111;border-radius:30px;border:8px solid #111;overflow:hidden;display:flex;flex-direction:column}
.scr{flex:1;overflow:auto;padding:18px}.nav{display:flex;border-top:1px solid #ddd;background:#fff}
.nav button{flex:1;border:0;background:none;padding:9px 0;font:inherit;font-size:10px;color:#777;cursor:pointer}.nav .on{color:#111;font-weight:600}.nav b{display:block;font-size:17px}
.h{font-size:24px;font-weight:600;margin:8px 0 2px;line-height:1.15}.m{color:#777;font-size:12px}.k{font-size:10px;letter-spacing:.1em;color:#777;margin:10px 0 4px}
.chip{display:inline-block;border:1px solid #ccc;border-radius:16px;padding:5px 11px;font-size:11px;margin:0 4px 6px 0;background:#fff;cursor:pointer;color:#111}.chip.on{background:var(--gold);border-color:var(--gold);font-weight:600}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:#111;color:#fff;font:inherit;font-size:13px;cursor:pointer;margin:10px 0}.btn.g{background:var(--gold);color:#111;font-weight:600}.btn.o{background:#fff;color:#111;border:1px solid #ccc}
.in{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font:inherit;font-size:13px;margin:3px 0 8px;background:#fff;color:#111}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.it{background:#fff;border-radius:10px;padding:8px;font-size:12px;position:relative;cursor:pointer}
.pic{height:88px;background:#e4e4e4;border-radius:8px;display:grid;place-items:center;font-size:38px}.heart{position:absolute;top:12px;right:12px;background:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:12px}
.a{color:#777;font-size:12px;text-decoration:underline;cursor:pointer;display:block;text-align:center;margin:8px 0}.bub{padding:10px 12px;border-radius:12px;font-size:12px;margin:6px 0;max-width:85%}.u{background:#111;color:#fff;margin-left:auto}.b{background:#fff}
.card{background:#fff;border-radius:12px;padding:12px;margin:8px 0;font-size:12px}.big{font-size:28px;font-weight:600}
.deck{width:min(860px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px}.deck h1{font-size:30px;margin:0 0 6px}.deck p,.deck li{line-height:1.6;color:var(--mut);font-size:14px}
.pr{background:var(--bg);border-left:4px solid var(--gold);padding:14px;border-radius:8px;white-space:pre-wrap;color:var(--fg);font-size:13px;line-height:1.6}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.cols h3{font-size:14px;margin:0 0 4px}.dk{display:inline-block;width:auto;padding:10px 18px;margin:12px 6px 0 0}
canvas{width:100%;height:420px;display:block;background:var(--bg);border-radius:12px;cursor:grab}
</style></head><body><main id="main"></main>

<script>

const nav=a=>`<div class="nav">${[["s02","Closet","▦"],["s04","Asistente","✦"],["s06","Tienda","👜"],["s08","Espejo","◎"]].map(([i,l,c])=>`<button class="${i===a?"on":""}" data-go="${i}"><b>${c}</b>${l}</button>`).join("")}</div>`;

const chips=(l,c,act)=>l.map(x=>`<span class="chip ${x===c?"on":""}" data-act="${act}" data-v="${x}">${x}</span>`).join("");

const P=`Monzatti es un ecosistema móvil para gestionar tu guardarropa y comprar ropa de marcas locales. Permite digitalizar prendas con la cámara, armar outfits con un asistente de IA, probarte prendas sobre un avatar 3D con tus medidas y comprar en un marketplace. Los socios comerciales (bazares y marcas emergentes) gestionan productos, inventario y ventas, y una comisión por venta sostiene el modelo. Un espejo inteligente proyecta el atuendo elegido.

Se desarrolla como proyecto de titulación de cinco estudiantes de la UTTEC entre noviembre de 2026 y abril de 2027. Lo que queremos lograr: una plataforma 100 % funcional, con marcas ficticias y pagos de prueba, que demuestre el flujo completo de registro, closet, prueba 3D, compra y venta.`;
const SC={
s01:()=>`<div class="scr"><div class="k" style="color:var(--gold)">MONZATTI</div><div class="h" style="font-size:30px;margin-top:40px">Vuelve a ti.</div><div class="m">Tu closet, tu espejo y tu próxima versión.</div><div style="margin:18px 0 6px">${chips(["Usuario final","Socio comercial"],S.role==="u"?"Usuario final":"Socio comercial","role")}</div><div class="k">CORREO ELECTRÓNICO</div><input class="in" placeholder="hola@ejemplo.com"><div class="k">CONTRASEÑA</div><input class="in" type="password" value="12345678"><span class="a" data-go="s012" style="text-align:right">¿Olvidaste tu contraseña?</span><button class="btn" data-act="login">Entrar a mi universo →</button><span class="a" data-go="s011">Crear cuenta</span><div class="m" style="text-align:center;font-size:10px">Al continuar, aceptas los Términos y el Aviso de privacidad.</div></div>`,
s011:()=>`<div class="scr"><span class="a" data-go="s01" style="text-align:left">← Volver</span><div class="h">Un estilo único. Una cuenta tuya.</div><div class="k">NOMBRE COMPLETO</div><input class="in" value="Valentina García"><div class="k">CORREO</div><input class="in" value="valentina@ejemplo.com"><div class="k">CONTRASEÑA</div><input class="in" type="password" value="Monzatti1"><div class="m" style="margin:-4px 0 8px">Mínimo 8 caracteres, una mayúscula y un número.</div><label class="m"><input type="checkbox" checked> Acepto los Términos y el Aviso de privacidad.</label><button class="btn" data-go="s02">Crear mi cuenta</button></div>`,
s012:()=>`<div class="scr"><span class="a" data-go="s01" style="text-align:left">← Volver</span><div class="h" style="margin-top:40px">Tu universo te espera.</div><div class="m">Ingresa tu correo y te enviaremos un enlace para crear una nueva contraseña.</div><div class="k">CORREO ELECTRÓNICO</div><input class="in" value="valentina@ejemplo.com"><button class="btn" data-act="sent">Enviar enlace</button>${S.sent?`<div class="card">✓ Enlace enviado. Es válido por 30 minutos. Revisa tu carpeta de spam.</div>`:""}</div>`,
s02:()=>`<div class="scr"><div class="k">MONZATTI</div><div class="h">Mi closet</div><div class="m">48 prendas · Infinitas posibilidades</div><div style="margin:10px 0 4px">${chips(["Todo","Blusas","Pantalones","Vestidos","Zapatos"],S.cat,"cat")}</div><div class="grid">${items.filter(i=>S.cat==="Todo"||i[2]===S.cat).map(i=>`<div class="it"><div class="pic">${i[1]}</div><span class="heart" data-act="fav" data-v="${i[0]}">${S.fav.includes(i[0])?"♥":"♡"}</span><b>${i[0]}</b><div class="m" style="font-size:10px">${i[3]}</div></div>`).join("")}</div><button class="btn g" data-go="s03">+ Nueva prenda</button></div>${nav("s02")}`,
s03:()=>`<div class="scr"><span class="a" data-go="s02" style="text-align:left">← Nueva prenda</span><div class="k">DALE VIDA A TU CLOSET</div><div class="h">Captura cada detalle.</div><div class="pic" style="height:200px;font-size:90px;border:2px dashed var(--gold);margin:10px 0">👚</div><div class="m" style="text-align:center">Centra la prenda con buena iluminación</div><div class="k">TALLA DE LA PRENDA</div>${chips(sizes,S.size,"size")}<button class="btn g" data-go="s02">Guardar en mi closet</button></div>`,
s04:()=>`<div class="scr"><div class="k">MONZATTI INTELLIGENCE</div><div class="h">Tu estilo, elevado.</div>${S.chat.map(c=>`<div class="bub ${c[0]}">${c[1]}</div>`).join("")}<div style="margin-top:8px">${chips(["Tengo una cena esta noche","Otra combinación","Look casual"],"","ask")}</div><div style="display:flex;gap:6px"><input class="in" id="q" placeholder="Pregunta sobre tu estilo…" style="margin:0"><button class="btn" data-act="send" style="width:auto;margin:0;padding:0 14px">➤</button></div><button class="btn g" data-go="s05">Ver en mi avatar</button></div>${nav("s04")}`,
s05:()=>`<div class="scr"><div class="h">Probador virtual</div><div class="k">TU AVATAR · VISTA FRONTAL</div><div class="pic" style="height:230px;font-size:120px;background:#d9d9d9"><span id="av" style="display:inline-block;transform:scaleY(${(S.h/168).toFixed(2)})">🧍</span></div><div class="card"><div class="k" style="margin:0">TUS MEDIDAS</div>Altura: <b id="hv">${S.h} cm</b><input type="range" min="150" max="190" value="${S.h}" data-act="h" style="width:100%"><br>Busto 90 cm · Cintura 70 cm</div><div class="k">TALLA</div>${chips(sizes,S.size,"size")}<div class="chip on">Ajuste recomendado: ${S.size}</div></div>${nav("s05")}`,
s06:()=>`<div class="scr"><div class="h">La selección</div><div class="m">Talento local. Estilo sin fronteras.</div><input class="in" placeholder="Busca prendas o marcas" style="margin-top:10px"><div class="grid">${shop.map((p,i)=>`<div class="it" data-go="s061" data-v="${i}"><div class="pic">${p[2]}</div><div class="k" style="margin:6px 0 0">${p[0].toUpperCase()}</div><b>${p[1]}</b><div>$${p[3].toLocaleString("es-MX")} MXN</div><span class="chip" style="margin-top:6px" data-go="s05">Probar en mi avatar</span></div>`).join("")}</div><div class="m" style="text-align:center;margin-top:10px">Bolsa: ${S.bag} artículo(s)</div></div>${nav("s06")}`,
s061:()=>{const p=shop[S.p||0];return`<div class="scr"><span class="a" data-go="s06" style="text-align:left">← Catálogo</span><div class="pic" style="height:170px;font-size:80px">${p[2]}</div><div class="k">${p[0].toUpperCase()} · DISEÑO LOCAL</div><div class="h">${p[1]}</div><div class="big">$${p[3].toLocaleString("es-MX")} MXN</div><div class="k">ELIGE TU TALLA</div>${chips(sizes,S.size,"size")}<button class="btn g" data-go="s05">Probar en mi avatar</button><button class="btn" data-act="bag">Añadir a bolsa (${S.bag})</button></div>`},
s07:()=>`<div class="scr"><div class="k">MONZATTI / BUSINESS</div><div class="h">Hola, Mariana.</div><div class="m">Tu marca, en movimiento.</div><div class="card"><div class="k" style="margin:0">VENTAS TOTALES · MXN</div><div class="big">$48,250</div><div style="color:#2a8a3a">↗ 18.6 % vs. mes anterior</div><div style="display:flex;align-items:flex-end;gap:5px;height:50px;margin-top:8px">${[10,15,12,20,16,26,33,29,38,35,43,50].map(h=>`<i style="flex:1;height:${h}px;background:var(--gold);border-radius:2px"></i>`).join("")}</div></div><div class="grid"><div class="card"><div class="k" style="margin:0">PEDIDOS</div><div class="big">32</div></div><div class="card"><div class="k" style="margin:0">PRODUCTOS</div><div class="big">${22+shop.length}</div></div></div><div class="card"><b>Inventario</b><br>Blusa de seda · 18 · Activo<br>Pantalón sastre · 03 · <b style="color:#c0392b">Bajo</b></div><button class="btn g" data-go="s071">+ Registrar producto</button></div>${nb("s07")}`,
s071:()=>`<div class="scr"><div class="h">Nuevo producto</div><div class="m">Comparte tu próxima pieza favorita.</div><div class="k">NOMBRE</div><input class="in" id="pn" value="Chamarra de lino"><div class="k">PRECIO · MXN</div><input class="in" id="pp" value="2100"><div class="k">TALLAS</div>${chips(["XS","S","M","L"],"M","x")}<button class="btn g" data-act="pub">Publicar producto</button><div class="m">Aparecerá en el catálogo de la tienda al publicar.</div></div>${nb("s071")}`,
s08:()=>`<div class="scr"><div class="h">Tu reflejo, reinventado.</div><div class="card">◎ MONZATTI Mirror 01 · <b style="color:#2a8a3a">Conectado</b></div><div class="pic" style="height:250px;font-size:110px;background:#111;color:#fff;position:relative;${S.mir?"box-shadow:0 0 0 3px var(--gold) inset":""}">${S.mir?"🧍":"<span style=font-size:14px>Pantalla en espera</span>"}${S.mir?`<span class="chip on" style="position:absolute;left:10px;top:10px;font-size:9px">EN VIVO</span>`:""}</div><div class="m" style="margin-top:8px">Cambia tu look desde el móvil y visualízalo al instante en tu espejo.</div><button class="btn g" data-act="mir">${S.mir?"Detener proyección":"Proyectar atuendo"}</button></div>${nav("s08")}`};
const deck=id=>id==="p1"?`<div class="deck"><div class="k" style="color:var(--gold)">PROYECTO DE TITULACIÓN · UTTEC</div><h1>¿Qué es Monzatti?</h1><p>Prompt del proyecto: qué es, para qué se desarrolla y qué queremos lograr.</p><div class="pr" id="pt">${P}</div><button class="btn dk" data-act="copy">Copiar prompt</button><button class="btn g dk" data-act="next">Ver objetivo →</button></div>`:`<div class="deck"><h1>Objetivo y alcance</h1><div class="cols"><div><h3>Para qué</h3><ul><li>Digitalizar el guardarropa</li><li>Probar ropa en un avatar 3D</li><li>Impulsar marcas locales</li></ul></div><div><h3>Qué queremos lograr</h3><ul><li>App móvil con dos tipos de cuenta</li><li>Marketplace con comisión por venta</li><li>Espejo inteligente conectado</li></ul></div><div><h3>Cómo</h3><ul><li>React Native + Expo y Node</li><li>Three.js para el 3D</li><li>Supabase y PostgreSQL</li></ul></div></div><p>Calendario: spike 3D el 20 de nov · Demo 1 el 29 de ene · Demo 2 el 5 de mar · Demo 3 el 9 de abr · Versión final el 30 de abr de 2027.</p><button class="btn g dk" data-act="next">Abrir el prototipo →</button></div>`;
const m3=()=>`<div class="deck" style="width:min(980px,100%)"><h1>Espejo inteligente 3D</h1><p>Arrastra para rotarlo. El botón proyecta el atuendo sobre el cristal.</p><div class="cols" style="grid-template-columns:1.1fr 1fr"><div><canvas id="cv"></canvas><button class="btn g dk" data-act="proj">Proyectar atuendo</button><button class="btn o dk" data-act="spin">Rotación automática</button></div><div><h3>Cómo construirlo</h3><ol><li><b>Espejo de dos vías</b> de unos 50–55 pulgadas, que refleja y deja pasar la luz.</li><li><b>Monitor o TV</b> de alto brillo pegado detrás del cristal.</li><li><b>Mini PC o Raspberry Pi</b> que muestra una página a pantalla completa.</li><li><b>Cámara web</b> 1080p arriba del marco (opcional: pose).</li><li><b>Marco</b> de aluminio o madera con ventilación y tira LED.</li><li><b>Enlace:</b> la app envía el atuendo por WebSocket y el espejo lo dibuja con Three.js.</li></ol><p>Ruta: 1) segunda pantalla en software, 2) maqueta con monitor y vidrio, 3) conexión por WebSocket, 4) cámara y pose. Costos por cotizar.</p></div></div></div>`;
let raf,spin=true,proj=true;
function init3d(){cancelAnimationFrame(raf);const c=$("#cv");if(!c||!window.THREE)return;const w=c.clientWidth,h=420,r=new THREE.WebGLRenderer({canvas:c,antialias:true});r.setSize(w,h,false);r.setPixelRatio(Math.min(devicePixelRatio,2));const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,w/h,.1,50);cam.position.set(0,1.1,7);cam.lookAt(0,1,0);sc.add(new THREE.AmbientLight(0xffffff,.7));const d=new THREE.DirectionalLight(0xffffff,.9);d.position.set(3,4,5);sc.add(d);const g=new THREE.Group();sc.add(g);
const M=(c,m,ro)=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:ro}),B=(w,h,e,mt,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,e),mt);o.position.set(x,y,z);g.add(o);return o};
const f=M(0xc9a227,.8,.3);B(2.3,.14,.25,f,0,2.25,0);B(2.3,.14,.25,f,0,-.25,0);B(.14,2.64,.25,f,-1.08,1,0);B(.14,2.64,.25,f,1.08,1,0);
B(2.02,2.36,.05,new THREE.MeshStandardMaterial({color:0x1b2733,metalness:1,roughness:.06,transparent:true,opacity:.9}),0,1,0);
B(.1,2.4,.1,M(0x222222,.5,.5),-.7,.9,-.35).rotation.x=.2;B(.1,2.4,.1,M(0x222222,.5,.5),.7,.9,-.35).rotation.x=.2;B(1.9,.08,1.1,M(0x222222,.5,.5),0,-.5,-.1);
const led=new THREE.MeshBasicMaterial({color:0xfff2b0});B(.04,2.4,.04,led,-1.0,1,.14);B(.04,2.4,.04,led,1.0,1,.14);
const cm=new THREE.Mesh(new THREE.SphereGeometry(.07,16,16),M(0x000000,.9,.2));cm.position.set(0,2.4,.12);g.add(cm);
const av=new THREE.Group(),gm=new THREE.MeshBasicMaterial({color:0xc9a227});[[0,1.95,0,.16],[0,1.45,0,.3]].forEach(a=>{const s=new THREE.Mesh(new THREE.SphereGeometry(a[3],16,16),gm);s.position.set(a[0],a[1],.05);av.add(s)});const lg=new THREE.Mesh(new THREE.CylinderGeometry(.16,.2,1,16),gm);lg.position.set(0,.6,.05);av.add(lg);g.add(av);
let dr=false,lx=0;c.onpointerdown=e=>{dr=true;lx=e.clientX;spin=false};addEventListener("pointerup",()=>dr=false);c.onpointermove=e=>{if(dr){g.rotation.y+=(e.clientX-lx)*.01;lx=e.clientX}};
const loop=()=>{if(!$("#cv"))return;if(spin)g.rotation.y+=.006;av.visible=proj;r.render(sc,cam);raf=requestAnimationFrame(loop)};loop()}
function render(){const id=S.v,m=$("#main");cancelAnimationFrame(raf);m.innerHTML=id[0]==="p"?deck(id):id==="m3d"?m3():`<div class="ph">${SC[id]()}</div>`;if(id==="m3d")init3d();$("#list").innerHTML=V.map(([i,l,g],k)=>(k&&V[k-1][2]===g?"":`<h4>${g}</h4>`)+`<button class="pv ${i===id?"on":""}" data-go="${i}">${l}</button>`).join("")}
const go=(v,x)=>{if(x!==undefined)S.p=+x;S.v=v;render()},step=n=>{const k=V.findIndex(x=>x[0]===S.v);go(V[(k+n+V.length)%V.length][0])},ans=["Combina tu blusa de seda con el pantalón sastre y tus botines. Sofisticado, sin esfuerzo.","Prueba el vestido midi con los botines de piel: elegante y cómodo.","Para algo casual: pantalón sastre con la blusa de seda y tenis blancos."];
function act(a,v){const q=()=>{const i=$("#q"),t=i&&i.value.trim();if(t)S.chat.push(["u",t]);else if(v)S.chat.push(["u",v]);S.chat.push(["b",ans[S.chat.length%3]])};
if(a==="next")return step(1);if(a==="prev")return step(-1);if(a==="reset"){location.reload();return}
if(a==="copy"){navigator.clipboard&&navigator.clipboard.writeText(P).catch(()=>{});return}
if(a==="proj"){proj=!proj;return}if(a==="spin"){spin=!spin;return}
if(a==="login")return go(S.role==="u"?"s02":"s07");if(a==="role")S.role=v==="Usuario final"?"u":"s";
if(a==="cat")S.cat=v;if(a==="size")S.size=v;if(a==="sent")S.sent=true;if(a==="mir")S.mir=!S.mir;if(a==="bag")S.bag++;
if(a==="fav")S.fav=S.fav.includes(v)?S.fav.filter(x=>x!==v):[...S.fav,v];if(a==="send"||a==="ask")q();
if(a==="pub"){shop.push(["Tu marca",$("#pn").value||"Producto nuevo","🧥",+$("#pp").value||0]);return go("s06")}render()}
document.addEventListener("click",e=>{const t=e.target.closest("[data-go],[data-act]");if(!t)return;t.dataset.go?go(t.dataset.go,t.dataset.v):act(t.dataset.act,t.dataset.v)});
document.addEventListener("input",e=>{if(e.target.dataset.act==="h"){S.h=+e.target.value;$("#av").style.transform=`scaleY(${(S.h/168).toFixed(2)})`;$("#hv").textContent=S.h+" cm"}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="q")act("send");else if(!/INPUT|TEXTAREA/.test(e.target.tagName)){if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1)}});
render();
</script></body></html>
